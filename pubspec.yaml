name: start
description: "A production-ready Flutter boilerplate architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^18.0.2

  # Network
  dio: ^5.8.0+1

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Functional Programming
  fpdart: ^1.1.1

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^11.2.0

  # UI & Styling
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^2.0.0

  # Utils
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  signature: ^5.5.0
  flutter_pdfview: ^1.4.0
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.0+1
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
